[workspace]
authors = ["Sacraniea <120763165+Sacraniea@users.noreply.github.com>", "Yidann <bio.aidan@gmail.com>"]
channels = ["conda-forge"]
name = "Computer Vision Subsystem"
platforms = ["linux-64", "win-64", { platform = "osx-arm64", macos = "14.0" }, "linux-aarch64"]
version = "0.1.0"

[tasks]
# Run the full subsystem until Ctrl+C. Add the GCS address to publish logs and photos.
cv-subsystem = { cmd = ["python", "-B", "run_local_demo.py", "--camera", "--targets", "--profile", "720p30", "--max-frames", "0", "--gcs", "auto", "--capture-interval-s", "3", "--calibration", "../ArUco Detection/calibration/oak_cam_a.json", "--calibration-mode", "oak-1080", "--marker-side-length-m", "0.20"], cwd = "Camera Stream", description = "Run until Ctrl+C; add a GCS address to publish logs and photos." }

# 10 Second Synthetic test for System Without the Camera
cv-sys-synthetic-test = { cmd = ["python", "-B", "run_local_demo.py", "--profile", "720p30", "--max-frames", "300", "--gcs", "preview", "--open-browser"], cwd = "Camera Stream", description = "Test the complete local transport with 300 generated marker frames." }

# Check camera capture on its own.
cv-sys-camera-test = { cmd = ["python", "-B", "run_camera_stream.py", "--headless", "--profile", "720p30", "--max-frames", "90", "--source-timeout-s", "10"], cwd = "Camera Stream", description = "Read 90 camera frames without detection or a preview window." }

# Run Target Detection Locally
cv-sys-target-detection-test = { cmd = ["python", "-B", "run_camera_stream.py", "--targets", "--profile", "720p30", "--max-frames", "3000", "--source-timeout-s", "10"], cwd = "Camera Stream", description = "Preview target detection and gauge reading for up to 3000 frames." }

# Run Camera Stream and Target Detection Locally
cv-sys-local-test = { cmd = ["python", "-B", "run_local_demo.py", "--camera", "--targets", "--profile", "720p30", "--max-frames", "900", "--gcs", "preview", "--capture-interval-s", "3", "--calibration", "../ArUco Detection/calibration/oak_cam_a.json", "--calibration-mode", "oak-1080", "--marker-side-length-m", "0.20", "--open-browser"], cwd = "Camera Stream", description = "Test 900 camera frames, browser video, MQTT and GCS previews." }

[dependencies]
python = "3.12.*"

[pypi-dependencies]
depthai = "==2.32.0.0"
numpy = "==2.5.2"
opencv-python = "==4.14.0.94"
vidgear = "==0.3.3"
paho-mqtt = "==2.1.0"
pyzmq = "==27.2.0"
msgpack = "==1.2.3"
msgpack-numpy = "==0.4.8"
simplejpeg = "==1.9.0"
setuptools = "==80.9.0"
amqtt = "==0.11.3"
pyyaml = "==6.0.2"
ultralytics = "==8.4.174"
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.28.0", index = "https://download.pytorch.org/whl/cpu" }

[target.osx.pypi-dependencies]
torch = { version = "==2.13.0", index = "https://pypi.org/simple" }
torchvision = { version = "==0.28.0", index = "https://pypi.org/simple" }
