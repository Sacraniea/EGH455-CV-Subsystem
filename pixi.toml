[workspace]
authors = ["Sacraniea <120763165+Sacraniea@users.noreply.github.com>", "Yidann <bio.aidan@gmail.com>"]
channels = ["conda-forge"]
name = "Computer Vision Subsystem"
platforms = ["linux-64", "win-64", { platform = "osx-arm64", macos = "14.0" }, "linux-aarch64"]
version = "0.1.0"

[tasks]
# Run the OAK subsystem until Ctrl+C. Add the GCS address to send logs and photos.
cv-subsystem = { cmd = ["python", "-B", "run_subsystem.py", "--source", "oak", "--profile", "720p30", "--max-frames", "0", "--capture-interval-s", "3", "--calibration", "../ArUco Detection/calibration/oak_cam_a.json", "--calibration-mode", "oak-1080", "--marker-side-length-m", "0.20"], cwd = "Camera Stream", description = "Run the OAK camera and both detection paths; add a GCS broker address to publish." }

# Check video and marker processing without connecting a camera.
cv-sys-synthetic-test = { cmd = ["python", "-B", "run_subsystem.py", "--source", "synthetic", "--no-targets", "--profile", "720p30", "--max-frames", "300", "--open-browser"], cwd = "Camera Stream", description = "Show 300 generated marker frames and save their results locally." }

# Check OAK capture alone, with no detectors, video receiver, browser or photos.
cv-sys-camera-test = { cmd = ["python", "-B", "run_stream.py", "--source", "oak", "--no-targets", "--no-aruco", "--no-photos", "--no-video", "--profile", "720p30", "--max-frames", "90", "--source-timeout-s", "10"], cwd = "Camera Stream", description = "Read and record 90 OAK frames without starting network services." }

# Preview gauge and valve detection from the OAK camera.
cv-sys-target-detection-test = { cmd = ["python", "-B", "run_subsystem.py", "--source", "oak", "--no-aruco", "--no-photos", "--profile", "720p30", "--max-frames", "3000", "--source-timeout-s", "10", "--open-browser"], cwd = "Camera Stream", description = "Show gauge and valve detection for up to 3000 frames; Ctrl+C stops early." }

# Run a finite OAK test with both detection paths and local detection photos.
cv-sys-local-test = { cmd = ["python", "-B", "run_subsystem.py", "--source", "oak", "--profile", "720p30", "--max-frames", "900", "--capture-interval-s", "3", "--calibration", "../ArUco Detection/calibration/oak_cam_a.json", "--calibration-mode", "oak-1080", "--marker-side-length-m", "0.20", "--open-browser"], cwd = "Camera Stream", description = "Test 900 OAK frames, detection overlays and saved photos without a GCS address." }

# Use these only when starting the receiver and sender in separate terminals.
cv-sys-receiver = { cmd = ["python", "-B", "run_receiver.py"], cwd = "Camera Stream", description = "Receive annotated video and serve /stream.mjpeg." }
cv-sys-stream = { cmd = ["python", "-B", "run_stream.py", "--source", "oak", "--profile", "720p30", "--calibration", "../ArUco Detection/calibration/oak_cam_a.json", "--calibration-mode", "oak-1080", "--marker-side-length-m", "0.20"], cwd = "Camera Stream", description = "Run the OAK sender when a NetGear receiver is already listening." }

[dependencies]
python = "3.12.*"

[pypi-dependencies]
depthai = "==2.32.0.0"
numpy = "==2.5.2"
opencv-python = "==4.14.0.94"
vidgear = "==0.3.3"
paho-mqtt = "==2.1.0"
pyzmq = "==27.2.0"
msgpack = "==1.2.3"
msgpack-numpy = "==0.4.8"
simplejpeg = "==1.9.0"
setuptools = "==80.9.0"
amqtt = "==0.11.3"
pyyaml = "==6.0.2"
ultralytics = "==8.4.174"
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.28.0", index = "https://download.pytorch.org/whl/cpu" }

[target.osx.pypi-dependencies]
torch = { version = "==2.13.0", index = "https://pypi.org/simple" }
torchvision = { version = "==0.28.0", index = "https://pypi.org/simple" }
